services:
  db:
    image: postgres:16-alpine
    container_name: task-api-db
    restart: unless-stopped
    environment:
      # No fallback defaults for credentials — these MUST come from .env.
      # (Non-sensitive values like ports below still default sensibly.)
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (see .env.example)}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres runs every .sql/.sh file in this directory, once, the
      # first time it starts against an empty data volume.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: task-api-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_BACKEND: postgres
      # Inside the Docker network, Postgres is reachable at hostname "db"
      # (the service name above) — never localhost, which would mean
      # "this app container itself" from in here. Credentials still come
      # from .env only — nothing hardcoded here either.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${APP_PORT:-8020}:8000"

volumes:
  pgdata:
    # Named volume: Postgres data lives here, outside the container's
    # writable layer, so `docker compose down` (without -v) keeps it.
